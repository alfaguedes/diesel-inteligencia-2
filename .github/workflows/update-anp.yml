name: Atualizar dados da ANP e publicar o site
on:
  workflow_dispatch:
  schedule:
    - cron: "15 12 * * *"
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: diesel-inteligencia-pages
  cancel-in-progress: false
jobs:
  atualizar-e-publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Importar dados oficiais da ANP
        run: python scripts/update_anp.py
      - name: Salvar histórico
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Atualiza dados oficiais da ANP"
            git push
          fi
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4
